[project]
name = "trend-scope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "you" }
]
requires-python = ">=3.9"
dependencies = [
    "pytauri == 0.8.*",
    "pydantic == 2.*",
    "jsonschema >= 4.23, < 5",
    "anyio == 4.*",
    "numpy >= 1.26.0",
    "numba >= 0.60.0",
    "scipy >= 1.11.0",
    "cdsapi >= 0.7.7, < 0.8",
    "netCDF4 >= 1.6, < 2",
    "rasterio >= 1.3, < 2",
    "truststore >= 0.10, < 1; python_version >= '3.10'"
]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src-python"]
testpaths = ["src-python"]

[project.entry-points.pytauri]
ext_mod = "trend_scope.ext_mod"

[build-system]
requires = ["setuptools >= 80", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["src-python"] }

[tool.setuptools.package-data]
"trend_scope.services" = ["source-coverage.json", "assistant-contract.json"]
